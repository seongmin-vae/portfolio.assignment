
baseURL = 'https://seongmin-vae.github.io/portfolio.assignment/'
languageCode = 'ko'
title = 'Seongmin Portfolio'

enableRobotsTXT = true

[params]
  description = '초급프로젝트 수업 과제 및 학습용 개인 포트폴리오'
  email = 'baesungmin1267@naver.com'
  location = 'Jeon-ju, South Korea'

[params.homepage]
  sections = ["hero", "research", "writing"]

  [params.homepage.hero]
    enable = true
    layout = "hero"
    title = "About"

  [params.homepage.research]
    enable = true
    layout = "cards"
    title = "Projects"

  [params.homepage.writing]
    enable = true
    layout = "grid"
    title = "Writing"


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        enableInShortcodes = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["\\[", "\\]"],
            ["$$", "$$"]
          ]
          inline = [
            ["\\(", "\\)"],
            ["$", "$"]
          ]
  [markup.highlight]
    style = "friendly"
    noClasses = false
    lineNos = true
    guessSyntax = true

# ---------------------------------------------------------
# CASCADING DEFAULTS
# This applies settings to ALL files in the 'content' folder
# ---------------------------------------------------------

[[cascade]]
  layout = "single"      # 1. The Rule: Use single.html
  [cascade._target]
    path = "/**"         # 2. The Scope: Inside any folder (** = "Recursive" - go as deep as you want)
    kind = "page"        # 3. The Filter: But ONLY for regular text files (not list nor home pages)
